services:
  postgres:
    image: postgres:15-alpine
    container_name: andrea-postgres
    environment:
      POSTGRES_DB: andreadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NeverEndingWar64
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: andrea-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
